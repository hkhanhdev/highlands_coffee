services:
  postgres:
    image: postgres:14
    container_name: pgres_metadata_airflow
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - data_net

  spark-airflow:
    build:
      context: .
      dockerfile: Dockerfile.spark-airflow
    container_name: spark-airflow
    hostname: spark-airflow
    restart: always
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      # BẮT BUỘC: Đảm bảo Spark Master biết tên host của nó
      - SPARK_MASTER_HOST=spark-airflow 
      # RẤT QUAN TRỌNG: Buộc Spark lắng nghe trên tất cả các interfaces
      - SPARK_LOCAL_IP=spark-airflow 
      # Tùy chọn: Đảm bảo giao diện web của Master có thể truy cập
      - SPARK_MASTER_WEBUI_HOST=0.0.0.0
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark-scripts:/opt/airflow/spark-scripts
      - ./source_data:/opt/source_data
      - ./spark_config/spark-defaults.conf:/opt/spark_home/conf/spark-defaults.conf
    ports:
      - "7077:7077"
      - "4040:4040"  # Spark Application UI
      - "8080:8080"
      - "18080:18080"  # Spark History Server
    depends_on:
      - postgres
      - minio
      - iceberg-rest
    networks:
      - data_net
    command: >
      bash -c "
        rm -f /opt/airflow/airflow-webserver.pid &&
        airflow db init &&
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com &&
        /opt/spark_home/sbin/start-history-server.sh --properties-file /opt/spark_home/conf/spark-defaults.conf &
        /opt/spark_home/sbin/start-master.sh --properties-file /opt/spark_home/conf/spark-defaults.conf &
        /opt/spark_home/sbin/start-worker.sh spark://spark-airflow:7077 &
        airflow scheduler &&
        airflow webserver 
      "

  minio:
    hostname: minio
    container_name: minio
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DOMAIN=minio
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      data_net:
        aliases:
          - highlands-coffee-warehouse.minio

  iceberg-rest:
    hostname: iceberg-rest
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://highlands-coffee-warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH_STYLE_ACCESS=true
      - CATALOG_S3_FORCE_PATH_STYLE=true
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data_net

  trino:
    container_name: trino
    image: trinodb/trino:447
    hostname: trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino-config:/etc/trino
    depends_on:
     minio:
       condition: service_healthy
     iceberg-rest:
       condition: service_started
    networks:
      - data_net

volumes:
  postgres_data:
  minio_data:

networks:
  data_net:
    driver: bridge